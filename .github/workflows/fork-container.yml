name: Fork Container Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/documentation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_REPOSITORY_OWNER: seriousconcept1134
  OWNER_LC: seriousconcept1134
  IMAGE_NAME: searxng-enhanced

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    outputs:
      docker_tag: ${{ steps.info.outputs.docker_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            march: amd64
            os: ubuntu-24.04
          - arch: arm64
            march: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Setup podman
        env:
          PODMAN_VERSION: "v5.7.1"
        run: |
          sudo apt-get purge -y podman runc crun conmon
          curl -fsSLO "https://github.com/mgoltzsche/podman-static/releases/download/${{ env.PODMAN_VERSION }}/podman-linux-${{ matrix.march }}.tar.gz"
          curl -fsSLO "https://github.com/mgoltzsche/podman-static/releases/download/${{ env.PODMAN_VERSION }}/podman-linux-${{ matrix.march }}.tar.gz.asc"
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 0CCF102C4F95D89E583FF1D4F8B5AF50344BB503
          gpg --batch --verify "podman-linux-${{ matrix.march }}.tar.gz.asc" "podman-linux-${{ matrix.march }}.tar.gz"
          tar -xzf "podman-linux-${{ matrix.march }}.tar.gz"
          sudo cp -rfv ./podman-linux-${{ matrix.march }}/etc/. /etc/
          sudo cp -rfv ./podman-linux-${{ matrix.march }}/usr/. /usr/
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies for versioning
        run: pip install -r requirements.txt

      - name: Get info
        id: info
        run: |
          # Run info capture BEFORE frontend build to avoid '+dirty' flag
          export PYTHONPATH=$PYTHONPATH:.
          python3 -m searx.version freeze
          eval "$(python3 -m searx.version)"
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "git_url=$GIT_URL" >> $GITHUB_OUTPUT

      - name: Build Frontend Assets
        run: make themes.all

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: "ghcr.io"
          username: "${{ env.GITHUB_REPOSITORY_OWNER }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and Push
        env:
          DOCKER_TAG: ${{ steps.info.outputs.docker_tag }}
          VERSION_TAG: ${{ steps.info.outputs.version_tag }}
          GIT_URL: ${{ steps.info.outputs.git_url }}
        run: |
          # 1. Build the builder stage
          podman build \
            -f container/builder.dockerfile \
            -t localhost/searxng/searxng:builder \
            .
          
          # 2. Build the final dist image
          FINAL_IMAGE="ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-only"
          
          podman build \
            -f container/dist.dockerfile \
            --build-arg "VERSION=$VERSION_TAG" \
            --build-arg "VCS_URL=$GIT_URL" \
            --build-arg "VCS_REVISION=${{ github.sha }}" \
            --build-arg "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "$FINAL_IMAGE" \
            .
          
          # 3. Push to GHCR
          podman push "$FINAL_IMAGE"

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: "ghcr.io"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Release
        env:
          GIT_URL: "${{ needs.build.outputs.git_url }}"
          DOCKER_TAG: "${{ needs.build.outputs.docker_tag }}"
          CONTAINER_IMAGE_ORGANIZATION: "${{ env.OWNER_LC }}"
          CONTAINER_IMAGE_NAME: "${{ env.IMAGE_NAME }}"
        run: |
          IMAGE_BASE="ghcr.io/$CONTAINER_IMAGE_ORGANIZATION/$CONTAINER_IMAGE_NAME"
          
          for t in "$DOCKER_TAG" "latest"; do
            echo "Creating manifest for $IMAGE_BASE:$t"
            podman manifest rm "$IMAGE_BASE:$t" || true
            podman manifest create "$IMAGE_BASE:$t"
            podman manifest add "$IMAGE_BASE:$t" "docker://$IMAGE_BASE:amd64-only"
            podman manifest add "$IMAGE_BASE:$t" "docker://$IMAGE_BASE:arm64-only"
            podman manifest push "$IMAGE_BASE:$t" "docker://$IMAGE_BASE:$t"
          done
